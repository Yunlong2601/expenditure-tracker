<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff69b4">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Scan receipt</title>
<style>
  :root { --pink:#ff69b4; --bg:#fff0f5; --ink:#3a2a33; --muted:#8a6f7d; --line:#f3cfe0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1d1418; --ink:#f6e9ef; --muted:#b99aaa; --line:#4a3240; } }
  * { box-sizing:border-box; }
  body { margin:0; font:17px/1.4 -apple-system, system-ui, "PingFang SC", sans-serif; background:var(--bg); color:var(--ink);
         padding:max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  main { max-width:480px; margin:0 auto; }
  h1 { font-size:24px; margin:8px 0 16px; }
  .big { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:56px; border:0; border-radius:14px;
         background:var(--pink); color:#fff; font-size:18px; font-weight:600; cursor:pointer; }
  .big[disabled] { opacity:.6; }
  .ghost { background:transparent; color:var(--pink); border:2px solid var(--pink); }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 4px; }
  input, select { width:100%; min-height:44px; padding:8px 12px; font-size:17px; border:1px solid var(--line); border-radius:10px;
                  background:transparent; color:var(--ink); }
  .row { display:grid; grid-template-columns:2fr 1fr; gap:8px; }
  .card { border:1px solid var(--line); border-radius:16px; padding:16px; margin-top:16px; }
  .msg { margin-top:16px; padding:12px 14px; border-radius:12px; background:rgba(255,105,180,.12); }
  .msg a { color:var(--pink); }
  img#preview { width:100%; max-height:260px; object-fit:contain; border-radius:12px; margin-top:16px; display:none; }
  .stack > * + * { margin-top:10px; }
  .hidden { display:none !important; }
  details { margin-top:24px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Scan a receipt 🧾</h1>

  <div class="stack">
    <label for="cam" class="big" role="button">📷 Take photo</label>
    <input id="cam" type="file" accept="image/*" capture="environment" class="hidden">
    <label for="pick" class="big ghost" role="button">🖼️ Choose screenshot</label>
    <input id="pick" type="file" accept="image/*" class="hidden">
  </div>

  <img id="preview" alt="Receipt preview">
  <div id="msg" class="msg hidden" role="status" aria-live="polite"></div>

  <form id="review" class="card hidden">
    <label for="merchant">Shop</label>
    <input id="merchant" name="merchant" autocomplete="off">
    <div class="row">
      <div><label for="total">Amount</label><input id="total" name="total" inputmode="decimal" required></div>
      <div><label for="currency">Currency</label><input id="currency" name="currency" maxlength="3" autocapitalize="characters"></div>
    </div>
    <label for="date">Date</label>
    <input id="date" name="date" type="date">
    <label for="category">Category</label>
    <input id="category" name="category" list="cats" autocomplete="off">
    <datalist id="cats"></datalist>
    <label for="account">Paid from</label>
    <select id="account" name="account"></select>
    <label for="summary">What you bought</label>
    <input id="summary" name="summary" autocomplete="off">
    <div style="margin-top:16px"><button class="big" id="save" type="submit">Save expense</button></div>
  </form>

  <details>
    <summary>Settings</summary>
    <label for="key">Access key (RECEIPTS_API_KEY from your .env)</label>
    <input id="key" type="password" autocomplete="current-password">
  </details>
</main>
<script>
const $ = (id) => document.getElementById(id);
const keyInput = $("key");
keyInput.value = localStorage.getItem("receiptsKey") || "";
keyInput.addEventListener("change", () => localStorage.setItem("receiptsKey", keyInput.value.trim()));
if (!keyInput.value) document.querySelector("details").open = true;

let current = null;

function say(html) { const m = $("msg"); m.innerHTML = html; m.classList.remove("hidden"); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

async function send(file, fields, save) {
  const fd = new FormData();
  fd.append("file", file, file.name || "receipt.jpg");
  for (const [k, v] of Object.entries(fields || {})) if (v) fd.append(k, v);
  const res = await fetch(`api/receipt?save=${save}`, { method: "POST", body: fd, headers: { "X-Api-Key": keyInput.value.trim() } });
  let body; try { body = await res.json(); } catch { body = { message: `Server error (${res.status}).` }; }
  if (res.status === 401) body.message = "Wrong access key. Open Settings below and paste it in.";
  return body;
}

async function onFile(e) {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  current = file;
  $("preview").src = URL.createObjectURL(file); $("preview").style.display = "block";
  $("review").classList.add("hidden");
  say("Reading the receipt…");
  const r = await send(file, null, false);
  say(esc(r.message));
  if (!r.receipt) return;
  const rc = r.receipt;
  $("merchant").value = rc.merchant || ""; $("total").value = rc.total || "";
  $("currency").value = rc.currency || ""; $("date").value = rc.date || new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  $("category").value = rc.category || ""; $("summary").value = rc.summary || "";
  $("cats").innerHTML = (r.categories || []).map(c => `<option value="${esc(c)}">`).join("");
  $("account").innerHTML = (r.accounts || []).map(a => `<option ${a === r.account ? "selected" : ""}>${esc(a)}</option>`).join("");
  $("review").classList.remove("hidden");
}
$("cam").addEventListener("change", onFile);
$("pick").addEventListener("change", onFile);

$("review").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!current) return;
  $("save").disabled = true; say("Saving…");
  const fields = Object.fromEntries(new FormData($("review")).entries());
  const r = await send(current, fields, true);
  $("save").disabled = false;
  say(esc(r.message) + (r.transaction_url ? ` <a href="${esc(r.transaction_url)}">Open in Firefly</a>` : ""));
  if (r.saved) { $("review").classList.add("hidden"); $("preview").style.display = "none"; current = null; }
});
</script>
</body>
</html>
