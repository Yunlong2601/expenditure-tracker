# Firefly III + its CSV importer + the receipt scanner, on one machine.
# Copy .env.example to .env, fill it in, then: docker compose up -d
#
#   Firefly III        http://localhost:8080
#   Data importer      http://localhost:8081   (bank CSV / Alipay / WeChat files)
#   Receipt scanner    http://localhost:8082   (photo or screenshot -> expense)

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: firefly
      MARIADB_USER: firefly
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 10

  firefly:
    # Same version as the firefly-iii/ source folder next to this file.
    image: fireflyiii/core:version-6.7.9
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_KEY: ${FIREFLY_APP_KEY}
      APP_URL: ${FIREFLY_PUBLIC_URL}
      SITE_OWNER: ${SITE_OWNER}
      TZ: ${TZ}
      DEFAULT_LANGUAGE: en_US
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${DB_PASSWORD}
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN}
    volumes:
      - upload:/var/www/html/storage/upload

  # Runs Firefly's daily jobs (recurring transactions, bill reminders).
  cron:
    image: alpine:3
    restart: unless-stopped
    depends_on: [firefly]
    command: >-
      sh -c "echo '0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/${STATIC_CRON_TOKEN}' | crontab - && crond -f -L /dev/stdout"

  importer:
    image: fireflyiii/data-importer:latest
    restart: unless-stopped
    depends_on: [firefly]
    ports:
      - "8081:8080"
    environment:
      FIREFLY_III_URL: http://firefly:8080
      VANITY_URL: ${FIREFLY_PUBLIC_URL}
      FIREFLY_III_ACCESS_TOKEN: ${FIREFLY_TOKEN}
      TZ: ${TZ}

  receipts:
    build: ./receipt-scanner
    restart: unless-stopped
    depends_on: [firefly]
    ports:
      - "8082:8000"
    environment:
      FIREFLY_URL: http://firefly:8080
      FIREFLY_PUBLIC_URL: ${FIREFLY_PUBLIC_URL}
      FIREFLY_TOKEN: ${FIREFLY_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      RECEIPT_MODEL: ${RECEIPT_MODEL:-claude-opus-5-5}
      RECEIPTS_API_KEY: ${RECEIPTS_API_KEY}
      ACCOUNT_MAP: ${ACCOUNT_MAP}
      DEFAULT_ACCOUNT: ${DEFAULT_ACCOUNT}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-SGD}
      TIMEZONE: ${TZ}

volumes:
  db:
  upload:
