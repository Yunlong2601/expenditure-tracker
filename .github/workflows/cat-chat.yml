name: Cat chat function

on:
  push:
    paths: ["supabase/**", ".github/workflows/cat-chat.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/cat-chat.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: deno lint supabase/functions/cat-chat
      - run: deno check supabase/functions/cat-chat/index.ts supabase/functions/cat-chat/cat_test.ts
      - run: deno test supabase/functions/cat-chat
